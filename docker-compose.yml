# Production-style stack: Postgres + Gunicorn + scheduler + Nginx.
# Usage: docker compose up -d --build
# Dev mode: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

x-app: &app
  build: .
  image: people-counting-middleware
  env_file: .env
  environment: &app-env
    DB_HOST: db
    DB_PORT: "5432"
    # Scheduler reaches the dummy Work Order API through the internal network.
    DUMMY_WO_URL: http://web.internal:8000/dummy/api_iot.php
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"
    networks:
      default:
        # Dotted alias so the Endpoint URLField in Admin accepts the internal dummy URL.
        aliases:
          - web.internal

  scheduler:
    <<: *app
    command: ["python", "manage.py", "run_scheduler"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  static:

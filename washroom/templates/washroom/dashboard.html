<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Washroom Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --soft: #f1f3f6; --border: #e6e9ee;
    --text: #0f172a; --muted: #64748b; --faint: #94a3b8; --track: #e8ebf0;
    --accent: #1d4ed8; --accent-soft: #e8eefc;
    --normal: #15803d; --normal-soft: #e6f6ec; --normal-bar: #22c55e;
    --warning: #c2410c; --warning-soft: #fdeee3; --warning-bar: #f97316;
    --critical: #b91c1c; --critical-soft: #fde8e8; --critical-bar: #ef4444;
    --none: #64748b; --none-soft: #eef1f5; --none-bar: #94a3b8;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --panel: #161b22; --soft: #1f2630; --border: #29313c;
    --text: #e6edf3; --muted: #9aa7b6; --faint: #6b7787; --track: #2a323d;
    --accent: #7aa2ff; --accent-soft: #1e2a47;
    --normal: #4ade80; --normal-soft: #16301f; --normal-bar: #22c55e;
    --warning: #fb923c; --warning-soft: #3a2615; --warning-bar: #f97316;
    --critical: #f87171; --critical-soft: #3b1d1f; --critical-bar: #ef4444;
    --none: #9aa7b6; --none-soft: #222a34; --none-bar: #4b5563;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --panel: #161b22; --soft: #1f2630; --border: #29313c;
      --text: #e6edf3; --muted: #9aa7b6; --faint: #6b7787; --track: #2a323d;
      --accent: #7aa2ff; --accent-soft: #1e2a47;
      --normal: #4ade80; --normal-soft: #16301f; --normal-bar: #22c55e;
      --warning: #fb923c; --warning-soft: #3a2615; --warning-bar: #f97316;
      --critical: #f87171; --critical-soft: #3b1d1f; --critical-bar: #ef4444;
      --none: #9aa7b6; --none-soft: #222a34; --none-bar: #4b5563;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  svg { display: block; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 16px clamp(16px, 4vw, 48px) 40px; }

  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px;
         border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; font-weight: 600;
         font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn.round { width: 40px; padding: 0; justify-content: center; }
  .btn svg { width: 18px; height: 18px; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .date-btn { position: relative; }
  .date-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .updated { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; background: none; border: 0; font: inherit; cursor: pointer; padding: 0 4px; }
  .updated svg { width: 17px; height: 17px; }

  .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin: 24px 0 22px; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -.02em; text-transform: uppercase; }
  .tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tag { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; font-weight: 500; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; }
  .filters label { display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .filters select { height: 42px; min-width: 150px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
                    background: var(--panel); color: var(--text); font: inherit; font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .filters label[hidden] { display: none; }

  .banner { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--critical-soft); color: var(--critical); font-weight: 600; font-size: 14px; }
  .banner[hidden] { display: none; }

  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
          padding: 20px; display: flex; flex-direction: column; min-width: 0; min-height: 180px; }
  .card.hero { grid-column: span 2; grid-row: span 2; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--none-soft); color: var(--none); flex: none; }
  .ico svg { width: 22px; height: 22px; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--none-soft); color: var(--none); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h3 { margin: 18px 0 0; font-size: 18px; font-weight: 700; }
  .card.soon h3 { color: var(--muted); font-weight: 600; }
  .dash { width: 30px; height: 3px; border-radius: 2px; background: var(--faint); margin-top: 32px; }
  .s-normal { --c: var(--normal); --c-soft: var(--normal-soft); --c-bar: var(--normal-bar); }
  .s-warning { --c: var(--warning); --c-soft: var(--warning-soft); --c-bar: var(--warning-bar); }
  .s-critical { --c: var(--critical); --c-soft: var(--critical-soft); --c-bar: var(--critical-bar); }
  .s-none { --c: var(--none); --c-soft: var(--none-soft); --c-bar: var(--none-bar); }
  .tinted .ico, .tinted .badge { background: var(--c-soft); color: var(--c); }
  .value { margin-top: 10px; font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .value small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .meter { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 12px; }
  .meter > div { height: 100%; border-radius: 999px; background: var(--c-bar, var(--accent)); transition: width .4s; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg { width: 15px; height: 15px; }
  .meta .on { color: var(--normal); font-weight: 600; } .meta .off { color: var(--critical); font-weight: 600; }
  .link { margin-top: auto; padding-top: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700;
          font-size: 14px; text-decoration: none; background: none; border: 0; font-family: inherit; cursor: pointer; padding-left: 0; align-self: flex-start; }
  .link svg { width: 16px; height: 16px; }

  .hero .ico { background: var(--accent-soft); color: var(--accent); }
  .hero h3 { font-size: 22px; }
  .big { display: flex; align-items: baseline; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .big b { font-size: clamp(56px, 7vw, 76px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .big span { color: var(--muted); font-size: 16px; font-weight: 500; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 26px; }
  .stat { background: var(--soft); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .stat div { color: var(--muted); font-size: 15px; }
  .stat b { display: block; margin-top: 6px; font-size: 21px; font-weight: 700; }
  .hero .meter { height: 8px; margin-top: 16px; }
  .hero .meter > div { background: var(--accent); }

  dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); color: var(--text); padding: 22px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog h3 { margin: 0 0 14px; font-size: 18px; }
  dialog ul { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
  dialog li { padding: 9px 12px; border-radius: 10px; display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-size: 14px; background: var(--c-soft); color: var(--c); }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .card.hero { grid-column: auto; grid-row: auto; }
    .title-row { flex-direction: column; align-items: stretch; }
    .filters { width: 100%; }
    .filters label { flex: 1; }
    .filters select { min-width: 0; width: 100%; }
    .topbar { justify-content: flex-start; }
  }
</style>
<script>
  try { const t = localStorage.getItem("washroom-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="btn round" id="prev" type="button" aria-label="Hari sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <label class="btn date-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span id="date-label">–</span>
      <input type="date" id="date-input" aria-label="Pilih tanggal">
    </label>
    <button class="btn round" id="next" type="button" aria-label="Hari berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="updated" id="refresh" type="button" title="Muat ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg><span id="updated">Memuat…</span></button>
    <button class="btn round" id="theme" type="button" aria-label="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>

  <div class="title-row">
    <div>
      <h1 id="building">–</h1>
      <div class="tags" id="tags"></div>
    </div>
    <div class="filters">
      <label id="building-filter" hidden>Gedung<select id="f-building"></select></label>
      <label>Lantai<select id="f-floor"></select></label>
      <label>Gender<select id="f-gender"></select></label>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="rules">
  <h3 id="rules-title"></h3>
  <ul id="rules-list"></ul>
  <form method="dialog"><button class="btn" type="submit">Tutup</button></form>
</dialog>

<script>
const URLS = {
  washrooms: "{% url 'washroom-list' %}",
  dashboard: "{% url 'washroom-dashboard' %}",
  events: "{% url 'admin:core_eventlog_changelist' %}",
};
const REFRESH_MS = {{ refresh_seconds }} * 1000;
// Ammonia is in ppm; its meter is drawn on this scale.
const AMONIA_SCALE_PPM = 50;

const S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  people: `<svg ${S}><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>`,
  feedback: `<svg ${S}><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>`,
  soap: `<svg ${S}><path d="M9 3h4M11 3v3M8 6h6l1 3H7zM7 9h8v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM15 6h3"/></svg>`,
  toilet_paper: `<svg ${S}><ellipse cx="9" cy="9" rx="6" ry="5"/><circle cx="9" cy="9" r="1.5"/><path d="M15 9v6c0 1.5-2 2-2 2h-2M3 9v4"/></svg>`,
  tissue: `<svg ${S}><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M9 10c0-3 1.5-6 3-6s3 3 3 6M8 15h8"/></svg>`,
  trash: `<svg ${S}><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>`,
  amonia: `<svg ${S}><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg>`,
  battery: `<svg ${S}><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4"/></svg>`,
  clock: `<svg ${S}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  arrow: `<svg ${S}><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  info: `<svg ${S}><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>`,
};

let washrooms = [];
let current = null;          // last dashboard response
let selected = {washroom: null, date: null};
let timer = null;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

const jakarta = opts => new Intl.DateTimeFormat("en-GB", {timeZone: "Asia/Jakarta", ...opts});
function todayIso() {
  return new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Jakarta"}).format(new Date());
}
function shiftDate(iso, days) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function fmtDay(iso) {
  return jakarta({weekday: "short", day: "2-digit", month: "short", year: "numeric"}).format(new Date(iso + "T12:00:00+07:00")).replace(/,/g, "");
}
function fmtClock(iso) {
  return jakarta({hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(iso));
}
function fmtStamp(iso) {
  return jakarta({day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(iso)).replace(",", "");
}
function fmtNum(n) {
  return Number.isInteger(n) ? String(n) : Number(n).toFixed(1);
}

async function getJson(url) {
  const response = await fetch(url, {credentials: "same-origin", headers: {Accept: "application/json"}});
  if (response.status === 401 || response.status === 403) { window.location.reload(); throw new Error("login"); }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);
  return body;
}

/* ---------- filters ---------- */

function unique(values) { return [...new Set(values)]; }

function fillSelect(select, options, value) {
  select.innerHTML = options.map(([v, label]) => `<option value="${esc(v)}">${esc(label)}</option>`).join("");
  select.value = value;
}

function renderFilters() {
  const w = washrooms.find(x => x.id === selected.washroom);
  if (!w) return;
  const buildings = unique(washrooms.map(x => x.building));
  document.getElementById("building-filter").hidden = buildings.length < 2;
  fillSelect(document.getElementById("f-building"), buildings.map(b => [b, b]), w.building);
  const inBuilding = washrooms.filter(x => x.building === w.building);
  fillSelect(document.getElementById("f-floor"), unique(inBuilding.map(x => x.floor)).map(f => [f, f]), w.floor);
  const onFloor = inBuilding.filter(x => x.floor === w.floor);
  fillSelect(document.getElementById("f-gender"), onFloor.map(x => [x.gender, x.gender_label]), w.gender);
}

function pickWashroom(building, floor, gender) {
  const candidates = washrooms.filter(x => x.building === building);
  const onFloor = candidates.filter(x => x.floor === floor);
  const pool = onFloor.length ? onFloor : candidates;
  const match = pool.find(x => x.gender === gender) || pool[0];
  if (match) { selected.washroom = match.id; load(); }
}

document.getElementById("f-building").addEventListener("change", e => pickWashroom(e.target.value, null, null));
document.getElementById("f-floor").addEventListener("change", e => {
  pickWashroom(document.getElementById("f-building").value, e.target.value, document.getElementById("f-gender").value);
});
document.getElementById("f-gender").addEventListener("change", e => {
  pickWashroom(document.getElementById("f-building").value, document.getElementById("f-floor").value, e.target.value);
});

/* ---------- date ---------- */

function renderDate() {
  const today = todayIso();
  const isToday = selected.date === today;
  document.getElementById("date-label").textContent = (isToday ? "Hari ini · " : "") + fmtDay(selected.date);
  const input = document.getElementById("date-input");
  input.max = today;
  input.value = selected.date;
  document.getElementById("next").disabled = isToday;
}

function setDate(iso) {
  if (!iso || iso > todayIso()) return;
  selected.date = iso;
  load();
}

document.getElementById("prev").addEventListener("click", () => setDate(shiftDate(selected.date, -1)));
document.getElementById("next").addEventListener("click", () => setDate(shiftDate(selected.date, 1)));
document.getElementById("date-input").addEventListener("change", e => setDate(e.target.value));
document.getElementById("refresh").addEventListener("click", () => load());

/* ---------- cards ---------- */

function soonCard(icon, title) {
  return `<article class="card soon">
    <div class="card-top"><div class="ico">${icon}</div><span class="badge">Segera Hadir</span></div>
    <h3>${esc(title)}</h3><div class="dash"></div></article>`;
}

function peopleCard(p, d) {
  if (!p.available) return soonCard(ICONS.people, "People Counting").replace('class="card soon"', 'class="card soon hero"');
  const hasCount = p.current_count != null;
  const pct = hasCount && p.maximum_trigger ? Math.min(100, p.current_count / p.maximum_trigger * 100) : 0;
  const from = `${d.date}T00:00:00`, to = `${d.date}T23:59:59`;
  let detail = `${URLS.events}?time_from=${from}&time_to=${to}`;
  if (p.device_ids.length === 1) detail += `&device__id__exact=${encodeURIComponent(p.device_ids[0])}`;
  return `<article class="card hero">
    <div class="card-top"><div class="ico">${ICONS.people}</div></div>
    <h3>People Counting</h3>
    <div class="big"><b>${p.people_in}</b><span>orang masuk ${d.is_today ? "hari ini" : "pada " + esc(fmtDay(d.date))}</span></div>
    <div class="stats">
      <div class="stat"><div>Hitungan saat ini</div><b>${hasCount ? `${p.current_count} / ${p.maximum_trigger}` : "—"}</b></div>
      <div class="stat"><div>Work Order</div><b>${p.work_orders}</b></div>
    </div>
    ${hasCount ? `<div class="meter" title="${Math.round(pct)}% menuju Work Order"><div style="width:${pct}%"></div></div>` : ""}
    <a class="link" href="${esc(detail)}">Lihat detail ${ICONS.arrow}</a>
  </article>`;
}

function satisfactionCard(c) {
  if (!c.available) return soonCard(ICONS.feedback, "Customer Satisfaction");
  const avg = c.average;
  const tone = avg == null ? "none" : avg >= 4 ? "normal" : avg >= 3 ? "warning" : "critical";
  const happy = c.total ? (c.by_rating["4"] + c.by_rating["5"]) / c.total * 100 : 0;
  const badge = avg == null ? "Belum ada respons" : avg >= 4 ? "Puas" : avg >= 3 ? "Cukup" : "Kurang";
  return `<article class="card tinted s-${tone}">
    <div class="card-top"><div class="ico">${ICONS.feedback}</div><span class="badge">${badge}</span></div>
    <h3>Customer Satisfaction</h3>
    <div class="value">${avg != null ? avg.toFixed(1) : "—"}<small> / 5 · ${c.total} respons</small></div>
    <div class="meter"><div style="width:${happy}%"></div></div>
    <div class="meta"><span>${Math.round(happy)}% memberi rating 4–5</span></div>
  </article>`;
}

function sensorCard(s, d) {
  const title = s.label;
  if (!s.available) return soonCard(ICONS[s.type], title);
  const tone = s.severity || "none";
  const hasLevel = s.level != null;
  const width = hasLevel ? Math.min(100, s.unit === "ppm" ? s.level / AMONIA_SCALE_PPM * 100 : s.level) : 0;
  const meta = [];
  if (s.battery != null) meta.push(`<span>${ICONS.battery}${s.battery}%</span>`);
  if (s.online === true) meta.push(`<span class="on">Online</span>`);
  if (s.online === false) meta.push(`<span class="off">Offline</span>`);
  if (s.last_seen) meta.push(`<span>${ICONS.clock}${esc(fmtStamp(s.last_seen))}</span>`);
  if (s.device_count > 1) meta.push(`<span>${s.device_count} perangkat${s.offline_count ? `, ${s.offline_count} offline` : ""}</span>`);
  return `<article class="card tinted s-${tone}">
    <div class="card-top"><div class="ico">${ICONS[s.type]}</div><span class="badge">${esc(s.condition || (hasLevel ? "Tanpa aturan" : "Belum ada data"))}</span></div>
    <h3>${esc(title)}</h3>
    <div class="value">${hasLevel ? esc(fmtNum(s.level)) : "—"}<small>${hasLevel ? " " + s.unit : ""}</small></div>
    <div class="meter"><div style="width:${width}%"></div></div>
    <div class="meta">${meta.join("")}</div>
    <button class="link" type="button" data-rules="${esc(s.type)}" data-label="${esc(title)}">${ICONS.info} Keterangan status</button>
  </article>`;
}

function render(d) {
  current = d;
  const w = d.washroom;
  document.getElementById("building").textContent = w.building;
  document.getElementById("tags").innerHTML = `<span class="tag">${esc(w.floor)}</span><span class="tag">${esc(w.gender_label)}</span>`;
  document.getElementById("updated").textContent = `Diperbarui ${fmtClock(d.generated_at)} WIB`;
  document.getElementById("grid").innerHTML = [
    peopleCard(d.people_counting, d),
    satisfactionCard(d.customer_satisfaction),
    ...d.sensors.map(s => sensorCard(s, d)),
  ].join("");
}

/* ---------- status rules dialog ---------- */

function rangeText(rule, unit) {
  const min = rule.min_level, max = rule.max_level;
  if (min == null && max == null) return "semua nilai";
  if (min == null) return `< ${fmtNum(max)}${unit}`;
  if (max == null) return `≥ ${fmtNum(min)}${unit}`;
  return `${fmtNum(min)} – <${fmtNum(max)}${unit}`;
}

document.addEventListener("click", event => {
  const button = event.target.closest("[data-rules]");
  if (!button || !current) return;
  const type = button.dataset.rules;
  const unit = type === "amonia" ? " ppm" : "%";
  const rules = current.status_rules.filter(r => r.type === type);
  document.getElementById("rules-title").textContent = `Keterangan status · ${button.dataset.label}`;
  document.getElementById("rules-list").innerHTML =
    (rules.length ? rules : [{condition: "Belum ada aturan", severity: "none"}])
      .map(r => `<li class="s-${esc(r.severity || "none")}"><span>${esc(r.condition)}</span><span>${r.type ? esc(rangeText(r, unit)) : ""}</span></li>`).join("")
    + `<li class="s-none"><span>Offline</span><span>&gt; ${current.offline_after_minutes} menit tanpa data</span></li>`;
  document.getElementById("rules").showModal();
});

/* ---------- loading ---------- */

function syncUrl() {
  const params = new URLSearchParams({washroom: selected.washroom});
  if (selected.date !== todayIso()) params.set("date", selected.date);
  history.replaceState(null, "", `?${params}`);
}

async function load() {
  clearTimeout(timer);
  renderFilters();
  renderDate();
  syncUrl();
  const banner = document.getElementById("banner");
  try {
    const params = new URLSearchParams({washroom: selected.washroom, date: selected.date});
    render(await getJson(`${URLS.dashboard}?${params}`));
    banner.hidden = true;
  } catch (error) {
    if (error.message === "login") return;
    banner.textContent = `Gagal memuat data (${error.message}). Mencoba lagi otomatis…`;
    banner.hidden = false;
  }
  // Only today's view changes over time.
  if (selected.date === todayIso()) timer = setTimeout(load, REFRESH_MS);
}

document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("washroom-theme", root.dataset.theme); } catch (e) {}
});

async function init() {
  const params = new URLSearchParams(location.search);
  try {
    washrooms = await getJson(URLS.washrooms);
  } catch (error) {
    if (error.message !== "login") {
      document.getElementById("grid").innerHTML = `<div class="card empty" style="grid-column:1/-1">Gagal memuat daftar washroom (${esc(error.message)}).</div>`;
    }
    return;
  }
  if (!washrooms.length) {
    document.getElementById("building").textContent = "Belum ada washroom";
    document.getElementById("updated").textContent = "";
    document.getElementById("grid").innerHTML = '<div class="card empty" style="grid-column:1/-1">Tambahkan washroom di Admin → Washrooms.</div>';
    return;
  }
  const wanted = Number(params.get("washroom"));
  selected.washroom = (washrooms.find(x => x.id === wanted) || washrooms[0]).id;
  const date = params.get("date");
  selected.date = date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= todayIso() ? date : todayIso();
  load();
}

init();
</script>
</body>
</html>

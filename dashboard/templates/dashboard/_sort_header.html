{# A sortable column header; h = one entry of views._column_sort's headers. #}<th{% if num %} class="num"{% endif %}{% if h.active %} aria-sort="{% if h.dir == 'desc' %}descending{% else %}ascending{% endif %}"{% endif %}><a class="sort-th{% if h.active %} sort-th--active{% endif %}" href="{{ h.href }}">{{ label }}<span class="sort-arrow" aria-hidden="true">{% if h.active %}{% if h.dir == "desc" %}↓{% else %}↑{% endif %}{% else %}↕{% endif %}</span></a></th>
